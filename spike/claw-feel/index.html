<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>집게 손맛 시제품</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(#ffe3ee, #ffc4dc);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: #5a2a43; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 12px;
    font-size: 13px; line-height: 1.5; background: rgba(255,255,255,.7);
    padding: 6px 10px; border-radius: 10px;
  }
  #hud b { font-size: 11px; opacity: .6; display: block; }
  #toast {
    position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(.8);
    font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(160,40,100,.7);
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #stick {
    position: fixed; left: 22px; bottom: calc(env(safe-area-inset-bottom) + 26px);
    width: 132px; height: 132px; border-radius: 50%;
    background: rgba(255,255,255,.55); border: 3px solid rgba(255,255,255,.9);
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%; background: #ff5c9a; box-shadow: 0 4px 10px rgba(160,40,100,.4);
  }
  #drop {
    position: fixed; right: 26px; bottom: calc(env(safe-area-inset-bottom) + 40px);
    width: 104px; height: 104px; border-radius: 50%; border: 0;
    background: #ff3d7f; color: #fff; font-size: 19px; font-weight: 800;
    box-shadow: 0 7px 0 #c21f5c, 0 12px 18px rgba(160,40,100,.35);
  }
  #drop:active, #drop.down { transform: translateY(5px); box-shadow: 0 2px 0 #c21f5c; }
  #drop:disabled { background: #d9a3b8; box-shadow: 0 7px 0 #b98498; }
  #tune {
    position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 12px; width: 200px;
    font-size: 13px; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 10px;
  }
  #tune summary { font-weight: 700; cursor: pointer; }
  #tune label { display: block; margin-top: 8px; }
  #tune input[type=range] { width: 100%; }
  #tune button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 8px; background: #ff5c9a; color: #fff; font-weight: 700; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud"><b>일회용 시제품</b>시도 <span id="tries">0</span> · 성공 <span id="wins">0</span></div>

<details id="tune">
  <summary>조정</summary>
  <label>집게 힘 <span id="gripValue">0.60</span>
    <input id="grip" type="range" min="0" max="1" step="0.05" value="0.6">
  </label>
  <label><input id="pity" type="checkbox" checked> 3번 실패하면 다음엔 꼭 잡힘</label>
  <label><input id="guide" type="checkbox" checked> 집게 위치 안내선</label>
  <button id="refill" type="button">인형 다시 채우기</button>
</details>

<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<button id="drop" type="button">내리기</button>

<script type="module" src="./main.js"></script>
</body>
</html>
